# forge-tasks — local / single-host deployment (all 8 components).
#
# Usage:
#   cp .env.example .env   # optional; sane defaults are built in
#   docker compose up -d
#
# This starts:
#   postgres — Postgres 16, data in the pgdata volume.
#   api      — REST API + SSE event stream + web UI on :8080. Applies the
#              embedded schema migrations (001 issues, 002 claims,
#              003 workflows, 004 artifacts) on every boot; they are
#              idempotent, so upgrades are safe.
#
# The MCP server (stdio transport) is not a long-lived service — run it
# attached when you need it:
#   docker compose run --rm mcp
#
# Endpoints once up:
#   http://localhost:8080/                web UI
#   http://localhost:8080/api/v1/...      REST API
#   http://localhost:8080/api/v1/events   SSE stream

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge_tasks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - forge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge_tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge_tasks}?sslmode=disable
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - forge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MCP server over stdio. Not started by `up`; attach with `run`.
  mcp:
    build:
      context: .
      target: mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge_tasks}?sslmode=disable
    stdin_open: true
    profiles: ["tools"]
    networks:
      - forge

networks:
  forge:
    driver: bridge

volumes:
  pgdata:
